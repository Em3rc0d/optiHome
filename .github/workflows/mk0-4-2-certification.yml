name: MK0.4.2 Low Latency Spatial Certification

on:
  push:
    branches:
      - "feat/mk0-4-2-low-latency-spatial-20260913"
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Tracking contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/components/try-on/VirtualTryOn.tsx)" = "c211cfc4025a2963fed7ae49b76e218aaeee5cb2"
          grep -q 'VirtualTryOnFast' src/components/catalog/FrameCatalog.tsx
          grep -q 'TRACKING_MAX_WIDTH = 480' src/components/try-on/VirtualTryOnFast.tsx
          grep -q 'TRACKING_CONSTRAINED_WIDTH = 384' src/components/try-on/VirtualTryOnFast.tsx
          grep -q 'STALE_TRACKING_MS = 420' src/components/try-on/VirtualTryOnFast.tsx
          grep -q 'refineLandmarks: false' src/components/try-on/VirtualTryOnFast.tsx
          grep -q 'width: { ideal: 960, max: 1280 }' src/components/try-on/VirtualTryOnFast.tsx

      - name: Spatial 3D contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'three@0.186.0' src/components/home/SpatialOptics.tsx
          grep -q 'useMotionCapability' src/components/home/SpatialOptics.tsx
          grep -q 'SpatialOptics' src/app/page.tsx
          grep -q 'IntersectionObserver' src/components/home/SpatialOptics.tsx
          grep -q 'renderer.setPixelRatio' src/components/home/SpatialOptics.tsx
          ! grep -q 'initial={reduceMotion ? false : { opacity: 0' src/components/home/SpatialOptics.tsx
          test -f docs/MK0.4.2-low-latency-spatial/PLAN.md
          test -f docs/MK0.4.2-low-latency-spatial/ARCHITECTURE.md
          test -f docs/MK0.4.2-low-latency-spatial/TEST-PLAN.md

      - name: Build
        run: npm run build

      - name: Runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -p 3000 > /tmp/optihome-next.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ >/tmp/home.html; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/products >/tmp/products.html
          grep -q "Spatial optics" /tmp/home.html
          grep -q "Showroom interactivo" /tmp/products.html
          ! grep -Eiq "error|fatal" /tmp/optihome-next.log
