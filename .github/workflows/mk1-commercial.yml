name: MK1 Commercial QA
on:
  push:
    branches: [feat/mk1-commercial-eyewear-final]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  commercial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commercial-qa
          path: qa-results
          retention-days: 3
