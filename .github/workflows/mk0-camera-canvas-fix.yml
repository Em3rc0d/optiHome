name: MK0 Camera Canvas Fix

on:
  push:
    branches: [rc/mk0-web-20260910]
    paths: ['.github/workflows/mk0-camera-canvas-fix.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Patch camera inference input and detector recovery
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/components/try-on/VirtualTryOn.tsx')
          s = p.read_text()

          old = '''  initialize?: () => Promise<void>;\n};'''
          new = '''  initialize?: () => Promise<void>;\n  reset?: () => void;\n};'''
          if old not in s:
              raise SystemExit('FaceDetector type anchor not found')
          s = s.replace(old, new, 1)

          old = '''  const stageRef = useRef<HTMLDivElement>(null);\n  const mountedRef = useRef(true);'''
          new = '''  const stageRef = useRef<HTMLDivElement>(null);\n  const cameraFrameRef = useRef<HTMLCanvasElement | null>(null);\n  const mountedRef = useRef(true);'''
          if old not in s:
              raise SystemExit('camera frame ref anchor not found')
          s = s.replace(old, new, 1)

          old = '''    latestFaceRef.current = null;\n    lastFaceSeenAtRef.current = 0;\n  };'''
          new = '''    latestFaceRef.current = null;\n    lastFaceSeenAtRef.current = 0;\n    cameraFrameRef.current = null;\n  };'''
          if old not in s:
              raise SystemExit('stopCamera reset anchor not found')
          s = s.replace(old, new, 1)

          old = '''        const faces = await detector.estimateFaces(video, { flipHorizontal: true });\n        const points = faces[0]?.keypoints ?? faces[0]?.landmarks ?? [];\n        const nextFace = faceGeometry({\n          points,\n          sourceWidth: video.videoWidth,\n          sourceHeight: video.videoHeight,\n          stageWidth: stage.clientWidth,\n          stageHeight: stage.clientHeight,\n          fit: "cover",\n        });\n\n        if (nextFace) {'''
          new = '''        const cameraFrame = cameraFrameRef.current ?? document.createElement("canvas");\n        cameraFrameRef.current = cameraFrame;\n        if (cameraFrame.width !== video.videoWidth) cameraFrame.width = video.videoWidth;\n        if (cameraFrame.height !== video.videoHeight) cameraFrame.height = video.videoHeight;\n        const cameraContext = cameraFrame.getContext("2d", { willReadFrequently: true });\n        if (!cameraContext) throw new Error("No se pudo preparar el frame de cámara.");\n        cameraContext.drawImage(video, 0, 0, cameraFrame.width, cameraFrame.height);\n\n        const faces = await detector.estimateFaces(cameraFrame, { flipHorizontal: true });\n        const points = faces[0]?.keypoints ?? faces[0]?.landmarks ?? [];\n        const nextFace = faceGeometry({\n          points,\n          sourceWidth: cameraFrame.width,\n          sourceHeight: cameraFrame.height,\n          stageWidth: stage.clientWidth,\n          stageHeight: stage.clientHeight,\n          fit: "cover",\n        });\n\n        if (faces[0] && !nextFace) detector.reset?.();\n\n        if (nextFace) {'''
          if old not in s:
              raise SystemExit('camera estimate block not found')
          s = s.replace(old, new, 1)

          p.write_text(s)

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit --audit-level=low
          npm audit --omit=dev --audit-level=low
          npm run lint
          npm run build
          git diff --check

      - name: Commit production fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/try-on/VirtualTryOn.tsx
          git commit -m 'fix(mk0): infer camera landmarks from stable canvas frames'
          git push origin HEAD:rc/mk0-web-20260910
