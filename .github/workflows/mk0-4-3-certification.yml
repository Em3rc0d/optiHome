name: MK0.4.3 Multi-Angle Try-On Certification

on:
  push:
    branches:
      - "feat/mk0-4-3-multi-angle-tryon-20260914"
      - "fix/mk0-4-3-assets-consumer-copy-20260914"
      - "fix/mk0-4-3-profile-orientation-20260914"
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Frozen rollback baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/components/try-on/VirtualTryOn.tsx)" = "c211cfc4025a2963fed7ae49b76e218aaeee5cb2"

      - name: Low-latency tracking contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'TRACKING_MAX_WIDTH = 480' src/components/try-on/VirtualTryOnFast.tsx
          grep -q 'TRACKING_CONSTRAINED_WIDTH = 384' src/components/try-on/VirtualTryOnFast.tsx
          grep -q 'STALE_TRACKING_MS = 420' src/components/try-on/VirtualTryOnFast.tsx
          grep -q 'refineLandmarks: false' src/components/try-on/VirtualTryOnFast.tsx
          grep -q 'width: { ideal: 960, max: 1280 }' src/components/try-on/VirtualTryOnFast.tsx

      - name: Multi-angle contracts
        shell: bash
        run: |
          set -euo pipefail
          test -f src/lib/try-on/face-pose.ts
          test -f src/lib/try-on/smoothing.ts
          test -f src/lib/try-on/multi-angle.ts
          test -f src/lib/try-on/generated-angle-assets.ts
          test -f src/components/try-on/MultiAngleFrameOverlay.tsx
          grep -q 'estimateYaw' src/components/try-on/VirtualTryOnFast.tsx
          grep -q 'smoothYaw' src/components/try-on/VirtualTryOnFast.tsx
          grep -q 'MultiAngleFrameOverlay' src/components/try-on/VirtualTryOnFast.tsx
          grep -q 'tryOnAngles?: FrameAngleAssets' src/types/frame.ts
          grep -q 'tryOnAnglesAuthority?: TryOnAnglesAuthority' src/types/frame.ts
          grep -q 'geometry?: FrameGeometry' src/types/frame.ts
          grep -q 'GENERATED_REFERENCE' src/content/frames.ts
          grep -q 'frame.tryOnAngles' src/components/try-on/MultiAngleFrameOverlay.tsx
          grep -q 'EXTERNAL_ASSET_GATE_OPEN' docs/MK0.4.3-multi-angle-tryon/ASSET-CONTRACT.md
          grep -q 'GENERATED_REFERENCE_ACTIVE' docs/MK0.4.3-multi-angle-tryon/GENERATED-ASSET-FALLBACK.md
          grep -q 'PHYSICAL_DEVICE_GATE_OPEN' docs/MK0.4.3-multi-angle-tryon/TEST-PLAN.md

      - name: Profile orientation contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'const earRight = yaw < 0' src/lib/try-on/multi-angle.ts
          grep -q 'nose left => temple right; nose right => temple left' src/lib/try-on/multi-angle.ts
          grep -q 'leftThreeQuarter: buildThreeQuarter(style, "left")' src/lib/try-on/generated-angle-assets.ts
          grep -q 'rightThreeQuarter: buildThreeQuarter(style, "right")' src/lib/try-on/generated-angle-assets.ts
          grep -q 'leftSide: buildSide(style, "left")' src/lib/try-on/generated-angle-assets.ts
          grep -q 'rightSide: buildSide(style, "right")' src/lib/try-on/generated-angle-assets.ts
          grep -q 'PROFILE_MAX_VISUAL_SHIFT_PERCENT = 18' src/components/try-on/MultiAngleFrameOverlay.tsx
          grep -q 'PROFILE_SCALE_GAIN = 0.26' src/components/try-on/MultiAngleFrameOverlay.tsx
          grep -q 'M535 226 C720 222 905 230 1082 246' src/lib/try-on/generated-angle-assets.ts

      - name: Build
        run: npm run build

      - name: Runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -p 3000 > /tmp/optihome-next.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ >/tmp/home.html; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/products >/tmp/products.html
          grep -q "Mira cada montura con más detalle" /tmp/home.html
          grep -q "Showroom interactivo" /tmp/products.html
          ! grep -Eiq "Three\.js · live|GPU|FPS objetivo desktop|Geometría procedural|Progressive fallback" /tmp/home.html
          ! grep -Eiq "error|fatal" /tmp/optihome-next.log
